<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ELKE STUDIO</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:#fff;
color:#111;
}

button{
font-family:inherit;
cursor:pointer;
}

a{
color:inherit;
text-decoration:none;
}

/* HEADER */

header{
width:100%;
border-bottom:1px solid #eee;
padding:20px 35px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
background:white;
z-index:1000;
}

.logo{
font-size:27px;
font-weight:800;
letter-spacing:4px;
}

.nav{
display:flex;
gap:25px;
align-items:center;
}

.nav button{
border:none;
background:none;
font-size:14px;
}

.header-icons{
display:flex;
gap:15px;
align-items:center;
}

.icon-btn{
border:none;
background:none;
font-size:20px;
position:relative;
}

.count{
position:absolute;
top:-7px;
right:-8px;
background:#111;
color:#fff;
font-size:9px;
width:17px;
height:17px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

/* HERO */

.hero{
padding:70px 30px;
text-align:center;
background:#f8f8f8;
}

.hero h1{
font-size:50px;
letter-spacing:7px;
margin-bottom:15px;
}

.hero p{
font-size:14px;
letter-spacing:2px;
}

/* SHOP */

.shop{
padding:50px 30px;
}

.shop-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.shop-title{
font-size:26px;
letter-spacing:2px;
}

.filters{
display:flex;
gap:10px;
}

.filters button{
padding:10px 16px;
border:1px solid #111;
background:#fff;
font-size:12px;
}

.filters button.active{
background:#111;
color:white;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
}

.product-card{
position:relative;
}

.product-image{
width:100%;
aspect-ratio:3/4;
overflow:hidden;
background:#f5f5f5;
position:relative;
}

.product-image img{
width:100%;
height:100%;
object-fit:cover;
transition:.3s;
}

.product-image img:hover{
transform:scale(1.03);
}

.wishlist{
position:absolute;
right:12px;
top:12px;
width:35px;
height:35px;
border:none;
border-radius:50%;
background:white;
font-size:18px;
z-index:5;
}

.wishlist.active{
color:red;
}

.product-info{
padding-top:13px;
}

.product-brand{
font-size:11px;
letter-spacing:1px;
color:#777;
margin-bottom:5px;
}

.product-name{
font-size:15px;
margin-bottom:7px;
}

.product-price{
font-size:14px;
font-weight:bold;
}

/* PRODUCT MODAL */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
display:none;
align-items:center;
justify-content:center;
z-index:3000;
padding:20px;
}

.overlay.show{
display:flex;
}

.product-modal{
background:white;
width:min(950px,100%);
max-height:90vh;
overflow:auto;
padding:25px;
position:relative;
}

.close{
position:absolute;
right:18px;
top:15px;
border:none;
background:none;
font-size:25px;
}

.product-detail{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.product-main-image{
width:100%;
aspect-ratio:3/4;
overflow:hidden;
background:#f5f5f5;
}

.product-main-image img{
width:100%;
height:100%;
object-fit:cover;
}

.thumbnails{
display:flex;
gap:8px;
margin-top:10px;
overflow-x:auto;
}

.thumbnails img{
width:70px;
height:85px;
object-fit:cover;
cursor:pointer;
border:1px solid #ddd;
}

.detail-brand{
font-size:12px;
color:#777;
letter-spacing:2px;
margin-bottom:8px;
}

.detail-name{
font-size:27px;
margin-bottom:10px;
}

.detail-price{
font-size:18px;
font-weight:bold;
margin-bottom:25px;
}

.size-title{
font-size:12px;
margin-bottom:10px;
letter-spacing:1px;
}

.sizes{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:25px;
}

.size{
border:1px solid #111;
background:white;
padding:10px 15px;
font-size:12px;
}

.size.selected{
background:#111;
color:white;
}

.size.unavailable{
opacity:.3;
text-decoration:line-through;
}

.add-cart{
width:100%;
padding:15px;
border:none;
background:#111;
color:white;
font-size:13px;
letter-spacing:1px;
}

/* CART */

.cart-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
display:none;
z-index:2500;
}

.cart-overlay.show{
display:block;
}

.cart{
position:absolute;
right:0;
top:0;
height:100%;
width:min(430px,100%);
background:white;
padding:25px;
overflow:auto;
}

.cart-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.cart-title{
font-size:22px;
letter-spacing:2px;
}

.cart-close{
border:none;
background:none;
font-size:25px;
}

.cart-item{
display:flex;
gap:15px;
padding:15px 0;
border-bottom:1px solid #eee;
}

.cart-item img{
width:80px;
height:100px;
object-fit:cover;
}

.cart-item-info{
flex:1;
}

.cart-item-name{
font-size:14px;
margin-bottom:5px;
}

.cart-item-size{
font-size:11px;
color:#777;
margin-bottom:7px;
}

.cart-item-price{
font-size:13px;
font-weight:bold;
}

.remove-item{
border:none;
background:none;
font-size:18px;
}

.cart-bottom{
margin-top:25px;
}

.cart-total{
display:flex;
justify-content:space-between;
font-size:16px;
font-weight:bold;
margin-bottom:15px;
}

.checkout-btn{
width:100%;
padding:15px;
border:none;
background:#111;
color:#fff;
font-size:13px;
letter-spacing:1px;
}

/* CHECKOUT */

.checkout-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
display:none;
align-items:center;
justify-content:center;
z-index:2800;
padding:20px;
}

.checkout-overlay.show{
display:flex;
}

.checkout-box{
background:white;
width:min(500px,100%);
padding:30px;
position:relative;
max-height:90vh;
overflow:auto;
}

.checkout-title{
font-size:25px;
letter-spacing:2px;
margin-bottom:25px;
}

.checkout-form{
display:flex;
flex-direction:column;
gap:14px;
}

.checkout-form input,
.checkout-form textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
font-family:inherit;
font-size:14px;
}

.checkout-form textarea{
height:100px;
resize:none;
}

.checkout-form button{
margin-top:5px;
}

/* SUCCESS */

.success-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
display:none;
align-items:center;
justify-content:center;
z-index:5000;
padding:20px;
}

.success-overlay.show{
display:flex;
}

.success-box{
background:white;
width:min(520px,100%);
max-height:90vh;
overflow:auto;
padding:35px 25px;
text-align:center;
position:relative;
}

.success-close{
position:absolute;
right:15px;
top:10px;
border:none;
background:none;
font-size:25px;
}

.success-icon{
width:60px;
height:60px;
border-radius:50%;
background:#111;
color:white;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 20px;
font-size:27px;
}

.success-box h2{
font-size:25px;
letter-spacing:2px;
margin-bottom:10px;
}

.success-small{
font-size:13px;
color:#666;
margin-bottom:25px;
line-height:1.6;
}

.success-products{
display:flex;
flex-direction:column;
gap:14px;
margin:20px 0 25px;
text-align:left;
}

.success-product{
display:flex;
gap:14px;
padding:12px;
border:1px solid #eee;
background:#fafafa;
}

.success-product img{
width:75px;
height:95px;
object-fit:cover;
background:#eee;
}

.success-product-info{
display:flex;
flex-direction:column;
justify-content:center;
gap:6px;
}

.success-product-info strong{
font-size:14px;
}

.success-product-info span{
font-size:12px;
color:#666;
}

.success-product-info b{
font-size:13px;
}

.success-order{
font-size:12px;
color:#777;
margin-bottom:20px;
}

.success-button{
width:100%;
padding:14px;
border:none;
background:#111;
color:white;
font-size:13px;
}

/* EMPTY */

.empty{
text-align:center;
padding:40px 10px;
color:#777;
font-size:14px;
}

/* FOOTER */

footer{
margin-top:70px;
padding:40px 30px;
border-top:1px solid #eee;
text-align:center;
}

.footer-logo{
font-size:22px;
font-weight:bold;
letter-spacing:4px;
margin-bottom:15px;
}

.instagram{
font-size:13px;
text-decoration:underline;
}

/* RESPONSIVE */

@media(max-width:800px){

header{
padding:17px 18px;
}

.logo{
font-size:21px;
}

.nav{
display:none;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.shop{
padding:35px 18px;
}

.hero{
padding:55px 20px;
}

.hero h1{
font-size:36px;
}

.shop-top{
align-items:flex-start;
flex-direction:column;
gap:18px;
}

.product-detail{
grid-template-columns:1fr;
}

.product-modal{
padding:18px;
}

}

@media(max-width:500px){

.products{
grid-template-columns:repeat(2,1fr);
}

.product-name{
font-size:13px;
}

.product-price{
font-size:13px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
ELKE STUDIO
</div>

<div class="nav">
<button onclick="scrollToShop()" id="navShop">SHOP</button>

</div>

ELKE STUDIO

</footer>


<!-- PRODUCT MODAL -->

<div class="overlay" id="productOverlay">

<div class="product-modal">

<button class="close" onclick="closeProduct()">
×

<div class="product-detail">

<div>

<div class="product-main-image">

</div>

<div class="cart">

×

</div>


<!-- CHECKOUT -->

<div class="checkout-overlay" id="checkoutOverlay">

<div class="checkout-box">

<button class="close" onclick="closeCheckout()">
×
</button>

<div class="checkout-title" id="checkoutTitle">
CHECKOUT
</div>

<form
class="checkout-form"
id="nnh9bt"
onsubmit="placeOrder(event)"
>

<input
type="text"
id="nameInput"
placeholder="Full name"
required
>

<input
type="tel"
id="phoneInput"
placeholder="Phone number"
required
>

<textarea
id="addressInput"
placeholder="Delivery address"
required
></textarea>

<button
class="checkout-btn"
type="submit"
id="placeOrderButton"
>
PLACE ORDER
</button>

</form>

</div>

</div>


<!-- SUCCESS -->

<div class="success-overlay" id="successOverlay">

<div class="success-box">

<button
class="success-close"
onclick="closeOrderSuccess()"
>
×
</button>

✓
</div>

THANK YOU!
</h2>

Your order has been received successfully.
</div>

<div
class="success-products"
id="successProducts"
></div>

<div
class="success-order"
id="successOrder"
></div>

<button
class="success-button"
onclick="closeOrderSuccess()"
id="successButton"
>
CONTINUE SHOPPING
</button>

</div>

</div>

const text={

size:"ზომა",
productPhoto:"პროდუქტის ფოტო",
order:"შეკვეთა",

};


/* =========================

========================= */

const products=[

/* =========================
   STATE
========================= */

let cart=[];
let wishlist=[];
let currentProduct=null;
let selectedSize=null;
let currentList=[...products];


/* =========================
   TRANSLATE
========================= */

function translate(){

document.getElementById("navShop").textContent=text[lang].navShop;
document.getElementById("navCart").textContent=text[lang].navCart;

document.getElementById("heroText").textContent=text[lang].heroText;

document.getElementById("shopTitle").textContent=text[lang].shopTitle;

document.getElementById("allFilter").textContent=text[lang].all;
document.getElementById("clothingFilter").textContent=text[lang].clothing;

document.getElementById("sizeTitle").textContent=text[lang].selectSize;

document.getElementById("addCartButton").textContent=text[lang].addCart;

document.getElementById("cartTitle").textContent=text[lang].cart;

document.getElementById("checkoutTitle").textContent=text[lang].checkout;

document.getElementById("nameInput").placeholder=text[lang].fullName;
document.getElementById("phoneInput").placeholder=text[lang].phone;
document.getElementById("addressInput").placeholder=text[lang].address;

document.getElementById("placeOrderButton").textContent=text[lang].placeOrder;

document.getElementById("successTitle").textContent=text[lang].thankYou;
document.getElementById("successText").textContent=text[lang].successText;
document.getElementById("successButton").textContent=text[lang].continueShopping;

document.getElementById("instagramText").textContent=text[lang].instagram;

document.getElementById("languageButton").textContent=
lang==="en" ? "KA" : "EN";

renderProducts(currentList);
renderCart();

}


/* =========================
   LANGUAGE TOGGLE
========================= */

function toggleLanguage(){

lang=lang==="en" ? "ka" : "en";

translate();

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(list){

const container=document.getElementById("products");

container.innerHTML="";

list.forEach(product=>{

const card=document.createElement("div");

card.className="product-card";

const liked=wishlist.includes(product.id);

card.innerHTML=`

<div class="product-image"
onclick="openProduct(${product.id})">

<img
src="${product.images[0]}"
alt="${product.name}"
>

<button
class="wishlist ${liked ? "active":""}"
onclick="event.stopPropagation();toggleWishlist(${product.id})"
>
${liked ? "♥":"♡"}
</button>

</div>

<div class="product-info">

<div class="product-brand">
${product.brand}
</div>

<div class="product-name">
${product.name}
</div>

<div class="product-price">
${product.price} GEL
</div>

</div>

`;

container.appendChild(card);

});

}


/* =========================
   FILTER
========================= */

function filterProducts(category,button){

document
.querySelectorAll(".filters button")
.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

if(category==="all"){
currentList=[...products];
}else{
currentList=products.filter(
product=>product.category===category
);
}

renderProducts(currentList);

}


/* =========================
   OPEN PRODUCT
========================= */

function openProduct(id){

currentProduct=products.find(
product=>product.id===id
);

selectedSize=null;

document.getElementById("detailBrand").textContent=
currentProduct.brand;

document.getElementById("detailName").textContent=
currentProduct.name;

document.getElementById("detailPrice").textContent=
currentProduct.price+" GEL";

document.getElementById("mainProductImage").src=
currentProduct.images[0];

const thumbs=document.getElementById("thumbnails");

thumbs.innerHTML="";

currentProduct.images.forEach(image=>{

const img=document.createElement("img");

img.src=image;

img.onclick=()=>{
document.getElementById("mainProductImage").src=image;
};

thumbs.appendChild(img);

});

renderSizes();

document
.getElementById("productOverlay")
.classList.add("show");

}


/* =========================
   SIZES
========================= */

function renderSizes(){

const container=document.getElementById("sizes");

container.innerHTML="";

currentProduct.sizes.forEach(size=>{

const button=document.createElement("button");

button.className="size";

if(!currentProduct.available.includes(size)){
button.classList.add("unavailable");
}

if(selectedSize===size){
button.classList.add("selected");
}

button.textContent=size;

button.onclick=()=>{

if(!currentProduct.available.includes(size)){
return;
}

selectedSize=size;

renderSizes();

};

container.appendChild(button);

});

}


/* =========================
   CLOSE PRODUCT
========================= */

function closeProduct(){

document
.getElementById("productOverlay")
.classList.remove("show");

}


/* =========================
   ADD TO CART
========================= */

function addToCart(){

if(!currentProduct){
return;
}

if(!selectedSize){

alert(
lang==="en"
?
"Please select a size."
:
"გთხოვ აირჩიე ზომა."
);

return;

}

cart.push({

id:currentProduct.id,
size:selectedSize

});

updateCartCount();

closeProduct();

openCart();

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

document.getElementById("cartCount").textContent=
cart.length;

}


/* =========================
   OPEN CART
========================= */

function openCart(){

renderCart();

document
.getElementById("cartOverlay")
.classList.add("show");

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

document
.getElementById("cartOverlay")
.classList.remove("show");

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

const container=document.getElementById("cartItems");
const bottom=document.getElementById("cartBottom");

container.innerHTML="";
bottom.innerHTML="";

if(cart.length===0){

container.innerHTML=`
<div class="empty">
${text[lang].emptyCart}
</div>
`;

return;

}

let total=0;

cart.forEach((item,index)=>{

const product=
products.find(
product=>product.id===item.id
);

total+=product.price;

const div=document.createElement("div");

div.className="cart-item";

div.innerHTML=`

<img
src="${product.images[0]}"
alt="${product.name}"
>

<div class="cart-item-info">

<div class="cart-item-name">
${product.brand} — ${product.name}
</div>

<div class="cart-item-size">
${text[lang].size}: ${item.size}
</div>

<div class="cart-item-price">
${product.price} GEL
</div>

</div>

<button
class="remove-item"
onclick="removeFromCart(${index})"
>
×
</button>

`;

container.appendChild(div);

});

bottom.innerHTML=`

<div class="cart-total">

<span>TOTAL</span>

<span>
${total} GEL
</span>

</div>

<button
class="checkout-btn"
onclick="openCheckout()"
>
${text[lang].checkout}
</button>

`;

}


/* =========================
   REMOVE FROM CART
========================= */

function removeFromCart(index){

cart.splice(index,1);

updateCartCount();

renderCart();

}


/* =========================
   CHECKOUT
========================= */

function openCheckout(){

if(cart.length===0){
return;
}

closeCart();

document
.getElementById("checkoutOverlay")
.classList.add("show");

}


/* =========================
   CLOSE CHECKOUT
========================= */

function closeCheckout(){

document
.getElementById("checkoutOverlay")
.classList.remove("show");

}


/* =========================
   PLACE ORDER
========================= */

async function placeOrder(event){

event.preventDefault();

const name=
document.getElementById("nameInput").value;

const phone=
document.getElementById("phoneInput").value;

const address=
document.getElementById("addressInput").value;


/*
IMPORTANT:
ვინახავთ შეკვეთილ პროდუქტებს
კალათის გასუფთავებამდე,
რათა ფოტოები წარმატების ფანჯარაშიც
გამოვაჩინოთ.
*/

const orderedProducts=cart.map(item=>{

const product=
products.find(
p=>p.id===item.id
);

return{

product:product,
size:item.size

};

});


/*
ეს ტექსტი Formspree-ში გაიგზავნება.
თითოეულ პროდუქტს დაემატება მისი
პირველი ფოტოს პირდაპირი URL.
*/

const orderItems=
orderedProducts.map(item=>{

const product=item.product;

const photo=
product.images && product.images.length
?
product.images[0]
:
"";

return `${product.brand} — ${product.name} | ${
item.size
?
(lang==="ka"
?
"ზომა: "
:
"Size: ")
+
item.size
+
" | "
:
""
}${product.price} GEL
${
lang==="ka"
?
"პროდუქტის ფოტო: "
:
"Product photo: "
}${photo}`;

}).join("\n\n");


const orderData={

name:name,

phone:phone,

address:address,

order:orderItems,

language:lang,

date:new Date().toLocaleString()

};


const button=
document.getElementById("placeOrderButton");

button.disabled=true;

button.textContent=
lang==="en"
?
"PLACING ORDER..."
:
"იგზავნება...";


try{

const response=
await fetch(
"https://formspree.io/f/xbglrzqb",
{

method:"POST",

headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},

body:JSON.stringify(orderData)

}
);


if(response.ok){

closeCheckout();

showOrderSuccess(
name,
orderedProducts
);

cart=[];

updateCartCount();

renderCart();

document
.getElementById("nnh9bt")
.reset();

}else{

alert(
lang==="en"
?
"Something went wrong. Please try again."
:
"დაფიქსირდა შეცდომა. გთხოვ სცადე თავიდან."
);

}

}catch(error){

console.error(error);

alert(
lang==="en"
?
"Something went wrong. Please check your internet connection."
:
"დაფიქსირდა შეცდომა. გთხოვ შეამოწმე ინტერნეტი."
);

}


button.disabled=false;

button.textContent=
text[lang].placeOrder;

}


/* =========================
   SUCCESS MODAL
========================= */

function showOrderSuccess(
name,
orderedProducts=[]
){

const productsContainer=
document.getElementById("successProducts");

productsContainer.innerHTML="";


orderedProducts.forEach(item=>{

const product=item.product;

const div=
document.createElement("div");

div.className="success-product";

div.innerHTML=`

<img
src="${product.images[0]}"
alt="${product.name}"
>

<div class="success-product-info">

<strong>
${product.brand} — ${product.name}
</strong>

<span>
${text[lang].size}: ${item.size}
</span>

<b>
${product.price} GEL
</b>

</div>

`;

productsContainer.appendChild(div);

});


document.getElementById("successText").textContent=
lang==="en"
?
`Thank you, ${name}! Your order has been received successfully.`
:
`გმადლობთ, ${name}! თქვენი შეკვეთა წარმატებით გაიგზავნა.`;


document.getElementById("successOrder").textContent=
lang==="en"
?
"ELKE STUDIO will contact you shortly."
:
"ELKE STUDIO მალე დაგიკავშირდებათ.";


document
.getElementById("successOverlay")
.classList.add("show");

}


/* =========================
   CLOSE SUCCESS
========================= */

function closeOrderSuccess(){

document
.getElementById("successOverlay")
.classList.remove("show");

}


/* =========================
   WISHLIST
========================= */

function toggleWishlist(id){

if(wishlist.includes(id)){

wishlist=
wishlist.filter(
item=>item!==id
);

}else{

wishlist.push(id);

}

renderProducts(currentList);

}


/* =========================
   SCROLL TO SHOP
========================= */

function scrollToShop(){

document
.getElementById("shop")
.scrollIntoView({
behavior:"smooth"
});

}


/* =========================
   INITIALIZE
========================= */

translate();

updateCartCount();

</script>

</body>
</html>
